<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Scott | Last World</title>

  <link
    rel="stylesheet"
    href="styles.css"
  >
</head>

<body>

  <main class="business-card">

    <!-- Atmospheric background -->
    <div class="stars"></div>
    <div class="mist"></div>

    <!-- Decorative elemental glow -->
    <div class="elemental-glow glow-one"></div>
    <div class="elemental-glow glow-two"></div>

    <section class="card-content">

      <!-- Last World Branding -->
      <div class="world-brand">

        <div class="relic-symbol">
          ⚔
        </div>

        <div class="brand-text">
          <h1>LAST WORLD</h1>
          <span>THE WORLD AFTER THE COLLAPSE</span>
        </div>

      </div>

      <div class="divider"></div>

      <!-- Personal Information -->
      <div class="identity">

        <h2>Scott</h2>

        <p class="title">
          Aspiring Software Engineer
        </p>

        <p class="specialties">
          Web Developer <span>•</span> Game Developer
        </p>

      </div>

      <!-- GitHub -->
      <a
        class="github-link"
        href="https://github.com/scottrasheed"
        target="_blank"
        rel="noopener noreferrer"
      >
        <span class="github-icon">◉</span>

        <span>
          github.com/scottrasheed
        </span>

        <span class="arrow">↗</span>
      </a>

      <!-- Footer -->
      <div class="card-footer">
        <span>EXPLORE</span>
        <span>CREATE</span>
        <span>DISCOVER</span>
      </div>

    </section>

  </main>

</body>
</html>
